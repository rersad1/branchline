name: Windows release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target-linux
      - run: cargo test --locked --manifest-path backend/Cargo.toml
        env:
          WSL_DISTRO_NAME: Branchline-CI-Fixture
          RUST_TEST_THREADS: '2'
      - run: bash scripts/build-d14-worker.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-helper
          path: desktop/assets/worker-linux-x86_64
          if-no-files-found: error
          retention-days: 3
  windows:
    needs: linux-helper
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> target
            desktop -> target
      - uses: actions/download-artifact@v4
        with:
          name: linux-helper
          path: desktop/assets
      - run: ./scripts/build-d4-terminal-host.ps1
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - run: npm test -- --maxWorkers=2
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo test --manifest-path desktop/Cargo.toml --locked --lib
      - run: cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build signed Windows installer
        working-directory: desktop
        run: npm run tauri -- build --ci --bundles nsis -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Prepare and verify release artifacts
        shell: pwsh
        run: |
          node scripts/release-manifest.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          cargo run --manifest-path desktop/Cargo.toml --locked --release --example verify-update -- "release-artifacts/Branchline_${version}_x64-setup.exe" "release-artifacts/Branchline_${version}_x64-setup.exe.sig" $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish complete GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $tag) { throw 'Publish requires the matching version tag' }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Published releases are immutable; increment the version' }
          } else {
            gh release create $tag --verify-tag --draft --title "Branchline $version" --notes-file "docs/releases/$version.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag release-artifacts/* --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
