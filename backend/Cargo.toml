[package]
name = "agent-workspace-backend"
default-run = "agent-workspace-backend"
version = "0.1.1"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
portable-pty = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Wdk_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "terminal_runtime"
harness = false

[[test]]
name = "ide_external"
harness = false
