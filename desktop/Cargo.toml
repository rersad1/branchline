[package]
name = "agent-workspace-desktop"
version = "0.2.0"
description = "Windows desktop shell for Agent Workspace Manager"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
agent-workspace-backend = { path = "../backend" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
sha2 = "0.10"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Notifications", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_Foundation", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
winreg = "0.10"
windows-core = "0.62"

